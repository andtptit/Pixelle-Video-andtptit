<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="810">
    <meta name="template:media-height" content="1440">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Full Focus - 1080x1920</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [PIXELLE-CUSTOM] Curated subtitle font choices, all confirmed Vietnamese-diacritic support:
         Baloo 2 (bold/rounded/playful), Be Vietnam Pro (clean modern sans, made by a VN team),
         Quicksand (light rounded). Type the exact name into the "Font Family" field below to switch. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 1080px; height: 1920px; overflow: hidden; }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
        }

        /* Full-bleed AI image — covers the entire frame */
        .bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url("{{image}}");
            background-size: cover;
            background-position: center;
        }

        /* Soft gradient behind the subtitle so text stays readable
           regardless of what the AI painted there */
        .subtitle-shade {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 520px;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.7) 100%);
        }

        .subtitle-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 140px;
            padding: 0 80px;
            text-align: center;
        }

        .subtitle-area .text {
            /* [PIXELLE-CUSTOM] {{font_family:text=Baloo 2}} — custom
               parameter, auto-shows as a text input in the Web UI (same
               mechanism as bg_color/text_color elsewhere). Type one of the
               preloaded names above (Baloo 2 / Be Vietnam Pro / Quicksand)
               to switch without editing this file.
               -webkit-text-stroke + paint-order gives the thick outlined
               "sticker" look (fill painted over the stroke, not under it). */
            font-family: '{{font_family:text=Baloo 2}}', 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 50px;
            font-weight: 800;
            line-height: 1.6;
            color: #ffffff;
            letter-spacing: 1px;
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* [PIXELLE-CUSTOM] Optional accent word — wrap a word in
           <span class="highlight">...</span> directly in the narration text
           to color just that word (e.g. "Nhìn thì có vẻ như là
           <span class=\"highlight\">rất yêu</span> bạn"). */
        .subtitle-area .text .highlight {
            color: #ffb020;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="subtitle-shade"></div>
    <div class="subtitle-area">
        <div class="text">{{text}}</div>
    </div>
    <!-- [PIXELLE-CUSTOM]
      This template expects the AI image itself (via API call) to be generated
      full-bleed 9:16, subject centered, with quiet top/bottom margins so the
      subtitle stays legible. It relies on the app's existing "Prompt Prefix"
      field (Style Config) to steer color tone + composition — no per-template
      prompt injection needed since that mechanism already prepends to every
      scene's image prompt. Suggested Prompt Prefix example:
      "warm pastel background tone, main subject centered in frame,
       generous empty space at top and bottom, no text, no watermark"
    -->
</body>
</html>
